
{% extends 'quiz/base.html' %}

{% block title %}Edit Test{% endblock %}

{% block content %}

    <h2>Edit Test</h2>

    <p>Editing: {{ test.title }}</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <p>
        <a href="{% url 'teacher_dashboard' %}">
            Cancel
        </a>
    </p>

{% endblock %}
