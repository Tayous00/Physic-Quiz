
{% extends 'quiz/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

    <h2>Student Login</h2>

    {% if form.errors %}
        <p>Your username or password is incorrect.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

{% endblock %}
